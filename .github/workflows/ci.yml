name: CI
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: status-im/nimbus-common-workflow/.github/workflows/common.yml@main
    with:
      install-command: &install |
        nimble --useSystemNim install -y --depsOnly

        # The tests compare against snappy-cpp
        (
          mkdir -p tests/snappycpp/build
          cd tests/snappycpp/build
          cmake_flags=(-DSNAPPY_BUILD_TESTS=OFF -DSNAPPY_BUILD_BENCHMARKS=OFF)
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cmake -E env CXXFLAGS="-w" cmake .. -G "MinGW Makefiles" -DCMAKE_IGNORE_PATH="C:/Program Files/Git/usr/bin" "${cmake_flags[@]}"
            mingw32-make
          elif echo | gcc -dM -E - | grep -q '__clang__'; then
            cmake -E env CC=gcc CXX=g++ cmake -D CMAKE_CXX_FLAGS="-Wno-error=unused-variable -Wno-error=unused-parameter -Wno-error=unknown-warning-option -Wno-error=uninitialized-const-pointer" "${cmake_flags[@]}" ../
            make
          else
            cmake -E env CC=gcc CXX=g++ cmake -D CMAKE_CXX_FLAGS="-Wno-unused-variable -Wno-unused-parameter" "${cmake_flags[@]}" ../
            make
          fi
          cp libsnappy.a ../../
        )
      test-command: |
        nimble test_asan
        nimble test

  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
          - os: macos
        include:
          - target:
              os: linux
            builder: ubuntu-latest
          - target:
              os: macos
            builder: macos-latest

    name: '${{ matrix.target.os }} Fuzz'
    runs-on: ${{ matrix.builder }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install fuzzing engines (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          # libFuzzer
          sudo apt-get install -y clang

          # honggfuzz
          nimble install -y testutils
          "$(nimble path testutils | head -1)/scripts/install_honggfuzz.sh"
          echo "/opt/honggfuzz/usr/local/bin" >> "$GITHUB_PATH"

          # afl
          sudo apt-get install -y afl++
          sudo afl-system-config

      - name: Install fuzzing engines (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update

          # libFuzzer
          brew install llvm
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"

          # honggfuzz
          nimble install -y testutils
          "$(nimble path testutils | head -1)/scripts/install_honggfuzz.sh"
          echo "/opt/honggfuzz/usr/local/bin" >> "$GITHUB_PATH"

          # afl
          brew install afl++
          sudo afl-system-config

      - name: Install dependencies
        run: *install

      - name: Run fuzzing tests
        run: nimble fuzz
